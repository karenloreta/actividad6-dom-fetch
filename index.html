<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad 6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Registro y Clima</h1>

  <main class="contenedor">
    <section class="columna">
      <h2>Registro</h2>
      <form id="formulario" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
        <small class="error" id="error-nombre"></small>

        <label for="email">Correo</label>
        <input type="email" id="email" required>
        <small class="error" id="error-email"></small>

        <label for="edad">Edad (18 a 99)</label>
        <input type="number" id="edad" required>
        <small class="error" id="error-edad"></small>

        <label for="telefono">Teléfono (10 dígitos)</label>
        <input type="text" id="telefono" inputmode="numeric">
        <small class="error" id="error-telefono"></small>

        <label for="password">Contraseña</label>
        <input type="password" id="password">
        <small class="error" id="error-password"></small>

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar">
        <small class="error" id="error-confirmar"></small>

        <button type="submit">Enviar</button>
      </form>
    </section>

    <section class="columna">
      <h2>Clima de una ciudad</h2>
      <div class="buscador">
        <input type="text" id="ciudad" placeholder="Ej: Bogotá">
        <button id="btn-buscar">Buscar</button>
      </div>
      <div id="resultado"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
