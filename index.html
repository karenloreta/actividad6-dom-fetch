<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity 6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sign up and Weather</h1>

  <main class="contenedor">
    <section class="columna">
      <h2>Sign up</h2>
      <form id="formulario" novalidate>
        <label for="nombre">Name</label>
        <input type="text" id="nombre" required>
        <small class="error" id="error-nombre"></small>

        <label for="email">Email</label>
        <input type="email" id="email" required>
        <small class="error" id="error-email"></small>

        <label for="edad">Age (18 to 99)</label>
        <input type="number" id="edad" required>
        <small class="error" id="error-edad"></small>

        <label for="telefono">Phone (10 digits)</label>
        <input type="text" id="telefono" inputmode="numeric">
        <small class="error" id="error-telefono"></small>

        <label for="password">Password</label>
        <input type="password" id="password">
        <small class="error" id="error-password"></small>

        <label for="confirmar">Confirm password</label>
        <input type="password" id="confirmar">
        <small class="error" id="error-confirmar"></small>

        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="columna">
      <h2>City weather</h2>
      <div class="buscador">
        <input type="text" id="ciudad" placeholder="E.g.: Bogotá" required minlength="3">
        <button id="btn-buscar">Search</button>
      </div>
      <small id="mensaje-ciudad"></small>
      <div id="resultado"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
